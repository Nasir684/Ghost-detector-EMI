name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
      - name: Recreate Android Project
        run: |
          flutter clean
          rm -rf android
          flutter create . --project-name ghost_detector_emi --org com.wanalab --platforms android
      - run: flutter pub get
      - run: flutter build apk --debug --verbose
      - uses: actions/upload-artifact@v4
        with:
          name: ghost-detector-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
